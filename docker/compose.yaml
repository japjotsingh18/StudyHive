name: studyhive

services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-studyhive}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-studyhive}
      POSTGRES_USER: ${POSTGRES_USER:-studyhive}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:8-alpine
    command: ["redis-server", "--appendonly", "no", "--save", ""]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "6379:6379"

  api:
    build:
      context: ..
      dockerfile: docker/api.Dockerfile
    env_file:
      - ../.env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health/ready')",
        ]
      interval: 5s
      timeout: 3s
      retries: 10
    ports:
      - "8000:8000"
    volumes:
      - local-storage:/var/lib/studyhive/storage

  web:
    build:
      context: ..
      dockerfile: docker/web.Dockerfile
    depends_on:
      api:
        condition: service_healthy
    environment:
      NEXT_PUBLIC_STUDYHIVE_API_URL: http://localhost:8000
    ports:
      - "3000:3000"

volumes:
  local-storage:
  postgres-data:
