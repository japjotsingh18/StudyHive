# Desired GitHub label taxonomy. Apply with a label-sync action only after
# maintainers approve the action and canonical repository permissions.
- name: "type: bug"
  color: "D73A4A"
  description: "Confirmed or reported product defect"
- name: "type: proposal"
  color: "A2EEEF"
  description: "Product or technical proposal requiring evaluation"
- name: "type: maintenance"
  color: "F9D0C4"
  description: "Dependency, tooling, refactoring, or upkeep"
- name: "type: security"
  color: "B60205"
  description: "Public-safe security hardening; vulnerabilities stay private"
- name: "needs: triage"
  color: "FBCA04"
  description: "Needs scope, priority, area, and owner review"
- name: "needs: design"
  color: "D4C5F9"
  description: "Requires product/UX decision or prototype"
- name: "needs: decision"
  color: "E99695"
  description: "Blocked on an explicit maintainer decision or ADR"
- name: "status: blocked"
  color: "BFDADC"
  description: "Cannot progress until a named dependency changes"
- name: "status: ready"
  color: "0E8A16"
  description: "Scoped, accepted, and ready for assignment"
- name: "good first issue"
  color: "7057FF"
  description: "Bounded, low-risk issue suitable for a first contribution"
- name: "help wanted"
  color: "008672"
  description: "Maintainers welcome community implementation"
- name: "area: docs"
  color: "0075CA"
  description: "Documentation and learning material"
- name: "area: web"
  color: "1D76DB"
  description: "Next.js UI and client behavior"
- name: "area: api"
  color: "5319E7"
  description: "FastAPI REST/realtime contracts"
- name: "area: data"
  color: "0052CC"
  description: "PostgreSQL schema, migrations, or query performance"
- name: "area: jobs"
  color: "006B75"
  description: "Scheduled work, outbox, and notification delivery"
- name: "area: auth"
  color: "B60205"
  description: "Identity, authentication, and authorization"
- name: "area: accessibility"
  color: "0E8A16"
  description: "Accessibility behavior or documentation"
- name: "area: reliability"
  color: "C2E0C6"
  description: "Attendance reliability policy, ledger, and appeals"
- name: "area: trust-safety"
  color: "D93F0B"
  description: "Privacy, moderation, abuse, reporting, and student safety"
- name: "area: community"
  color: "FAD8C7"
  description: "Open-source governance and contributor experience"
- name: "priority: critical"
  color: "B60205"
  description: "Immediate safety, security, data integrity, or outage risk"
- name: "priority: high"
  color: "D93F0B"
  description: "Important current-milestone risk or blocker"
- name: "priority: medium"
  color: "FBCA04"
  description: "Valuable and planned, but not a current blocker"
- name: "priority: low"
  color: "C5DEF5"
  description: "Useful follow-up with limited urgency"
- name: "phase: planning"
  color: "EDEDED"
  description: "Product/architecture planning before implementation"
- name: "phase: mvp"
  color: "BFD4F2"
  description: "Required for private-pilot MVP"
- name: "phase: beta"
  color: "D4C5F9"
  description: "Candidate for public beta"
- name: "phase: future"
  color: "FFFFFF"
  description: "Post-1.0 or Phase 2; not active scope"
