name: Documentation improvement
description: Report missing, confusing, incorrect, or inaccessible documentation.
title: "[Docs]: "
labels: ["area: docs", "needs: triage"]
body:
  - type: input
    id: location
    attributes:
      label: Page or file
      placeholder: docs/04-api-design.md
    validations:
      required: true
  - type: textarea
    id: issue
    attributes:
      label: What is unclear or incorrect?
    validations:
      required: true
  - type: textarea
    id: audience
    attributes:
      label: Who is blocked?
      description: Student, contributor, maintainer, operator, or another audience.
    validations:
      required: true
  - type: textarea
    id: suggestion
    attributes:
      label: Suggested improvement
  - type: checkboxes
    id: privacy
    attributes:
      label: Safety check
      options:
        - label: This report contains no secrets or personal student data.
          required: true
